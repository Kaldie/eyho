services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: eyho
      POSTGRES_USER: eyho
      POSTGRES_PASSWORD: eyho
    ports:
      - "5432:5432"
    # Schema and demo seed are loaded once, when the pgdata volume is first created (scripts run
    # in name order after the image's own 10_postgis.sh). There are no migrations: there is no
    # production database yet. After changing schema.sql, recreate the database with
    # `docker compose down -v && docker compose up`.
    # The seed holds the demo accounts and demo cooks (feature 001, FR-016). Local only: it flags
    # accounts is_demo and they sign in without a password. The local listings (feature 002) get
    # pickup windows relative to now() at load time, so recreate the volume to refresh them.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/20_schema.sql:ro
      - ./backend/src/db/seed/demo_accounts.sql:/docker-entrypoint-initdb.d/30_demo_accounts.sql:ro
      - ./backend/src/db/seed/local.sql:/docker-entrypoint-initdb.d/40_local_listings.sql:ro
    healthcheck:
      # Over TCP: during first-time init Postgres only listens on its Unix socket, so this stays
      # unhealthy until the schema and seed are loaded and the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U eyho -d eyho"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local sign-in: a standards-compliant mock OIDC issuer (feature 001, FR-015). No provider
  # account or internet needed. It listens on 8081 inside and outside the container so the issuer
  # URL (http://localhost:8081/eyho) is the same for the browser and, via OIDC_DISCOVERY_URL, the
  # backend. Interactive login: type any username and, in "Optional claims", for example
  #   {"https://eyho.app/email":"sanne@example.nl","https://eyho.app/email_verified":true}
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.3
    environment:
      SERVER_PORT: "8081"
      JSON_CONFIG_PATH: /config/config.json
    volumes:
      - ./infra/mock-oidc/config.json:/config/config.json:ro
    ports:
      - "8081:8081"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      mock-oidc:
        condition: service_started
    environment:
      DATABASE_URL: postgres://eyho:eyho@db:5432/eyho?sslmode=disable
      # Sign-in (feature 001). APP_ENV=local allows the mock issuer, one-tap demo accounts and the
      # fake business register; the backend refuses to start with these outside demo/local.
      APP_ENV: local
      OIDC_ISSUER: http://localhost:8081/eyho
      OIDC_DISCOVERY_URL: http://mock-oidc:8081/eyho
      OIDC_AUDIENCE: eyho-api
      DEMO_AUTH_ENABLED: "true"
      KVK_MODE: fake
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      PORT: "8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    environment:
      VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder}
      # The browser calls the dev server on its own origin (empty base); the dev server proxies
      # /api to the backend service. http://backend:8080 is not resolvable from the host browser.
      VITE_API_BASE: ""
      VITE_PROXY_TARGET: http://backend:8080
      VITE_OIDC_AUTHORITY: http://localhost:8081/eyho
      VITE_OIDC_CLIENT_ID: eyho-web
      VITE_OIDC_AUDIENCE: eyho-api
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  e2e:
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    # Share the mock-oidc network namespace so the browser's http://localhost:8081 (the OIDC
    # authority baked into the frontend) reaches the mock server; service names still resolve.
    network_mode: "service:mock-oidc"
    depends_on:
      mock-oidc:
        condition: service_started
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      PLAYWRIGHT_BASE_URL: http://frontend:5173
      API_BASE_URL: http://backend:8080
    volumes:
      - ./frontend/tests/e2e:/app/tests/e2e
      - e2e-results:/app/test-results
    profiles:
      - e2e

volumes:
  pgdata:
  e2e-results:
